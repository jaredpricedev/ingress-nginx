name: Resolve patched Go dependencies
on:
  push:
    branches:
      - diagnostics/dependency-refresh-1.12.3
    paths:
      - .github/workflows/dependency-refresh.yaml
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: GOLANG_VERSION
      - name: Resolve exact security updates in both modules
        run: |
          go get golang.org/x/net@v0.62.0 go.opentelemetry.io/otel@v1.41.0 go.opentelemetry.io/otel/trace@v1.41.0
          go mod tidy
          cd images/kube-webhook-certgen/rootfs
          go get golang.org/x/net@v0.62.0
          go mod tidy
      - name: Validate module integrity and preserve dependency changes
        run: |
          go mod verify
          (cd images/kube-webhook-certgen/rootfs && go mod verify && go test ./...)
          mkdir -p dist/dependency-refresh/images/kube-webhook-certgen/rootfs
          cp go.mod go.sum dist/dependency-refresh/
          cp images/kube-webhook-certgen/rootfs/go.mod images/kube-webhook-certgen/rootfs/go.sum dist/dependency-refresh/images/kube-webhook-certgen/rootfs/
          git diff -- go.mod go.sum images/kube-webhook-certgen/rootfs/go.mod images/kube-webhook-certgen/rootfs/go.sum > dist/dependency-refresh/dependency.patch
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: dependency-refresh
          path: dist/dependency-refresh/
          retention-days: 7
