name: Diagnose NGINX base smoke checks
on:
  push:
    branches: [diagnostics/dependency-refresh-1.12.3]
    paths: [.github/workflows/dependency-refresh.yaml]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: 1bb0f565d41f895fb2e570916fd4b5ab08dddbf9
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: docker.tar.gz
          run-id: 40969001025
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reproduce HTTP smoke checks with captured response
        run: |
          gzip -dc docker.tar.gz | docker load
          mkdir -p dist/patched-images
          python3 - <<'PY'
          from pathlib import Path
          source=Path('hack/smoke-patched-images.sh').read_text()
          source=source[source.index('# Exercise Lua'):source.index('docker run -d --name "$backend"')]
          source=source.replace('curl --fail --silent', 'curl --fail --silent --show-error')
          source=source.replace(' | grep -Fx', ' | tee dist/patched-images/last-response.txt | grep -Fx')
          source=source.replace('  docker logs "$name"', '  cat dist/patched-images/last-response.txt || true\n  docker inspect "$name" > dist/patched-images/smoke-state.json || true\n  docker logs "$name"')
          Path('/tmp/base-smoke.sh').write_text('set -euxo pipefail\ncontroller=ingress-controller/controller:1.0.0-dev\n'+source)
          PY
          bash /tmp/base-smoke.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: base-smoke-diagnostics
          path: dist/patched-images/
          retention-days: 7
